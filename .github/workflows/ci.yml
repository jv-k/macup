name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# De-duplicate PR runs only. A force-push mid-review (rebases, review fixups)
# used to leave the superseded matrix running to completion, so pull_request
# events share a per-ref group and cancel the run they replace.
#
# Pushes get github.run_id, which is unique per run and so puts every one in a
# group of its own. A shared group with cancel-in-progress: false would not
# "leave them alone" — it queues them, serializing main/develop behind each
# other. Every merged commit gets its own concurrent run this way.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint + typecheck
    # biome and tsc are platform-independent, so this runs on the faster,
    # less contended Linux pool. The darwin-only surface is exercised by
    # `test` and `compile-smoke`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  adr:
    name: ADR guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Pure-node corpus check (no deps): structure, numbering, and README index sync.
      - run: node scripts/check-adrs.mjs

  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build (tsup)
    # tsup emits platform-neutral ESM; the darwin single binary is
    # compile-smoke's job.
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: apps/cli/dist/

  docs-build:
    name: Build docs site
    # A Next.js build with no darwin dependency.
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=docs

  docs-visual:
    name: Docs visual snapshots
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Run inside the pinned Playwright image so font rasterization matches the
    # committed `-linux` baselines (generated in this same image). This removes
    # cross-machine AA drift, which a bare macOS runner cannot guarantee since
    # its font stack rolls with the image. Regenerate baselines by running the
    # docs `test:visual --update-snapshots` in this image (see apps/docs).
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@10.33.1 --activate
      # --ignore-scripts skips the darwin-only node-pty native build (unneeded
      # for docs screenshots and absent build tools in the image would fail it);
      # fumadocs-mdx is the one postinstall the docs build actually needs.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter docs exec fumadocs-mdx
      - run: pnpm --filter macup build
      - run: pnpm --filter docs test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/docs/playwright-report/

  compile-smoke:
    name: Compile smoke (bun --compile)
    runs-on: macos-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter macup build:binary darwin-arm64
      - run: ./apps/cli/dist/macup-darwin-arm64 --version
