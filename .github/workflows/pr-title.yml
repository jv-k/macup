name: PR title

# Keep PR titles in Conventional Commits shape for readable PR lists and changelogs.
# This is PR-title hygiene only. The enforcing gate on landed history is commits.yml,
# which validates each non-merge commit.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
