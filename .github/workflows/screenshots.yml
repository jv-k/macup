name: Screenshots

# Regenerates CLI visuals on every published release so the README stays in
# sync with the released tool. Everything renders via charmbracelet/vhs,
# which drives a real terminal emulator, so colors and prompts render
# faithfully.
#
#   img/screenshot.png    — vhs, single PNG of `macup --help`
#   img/demo.gif          — vhs, direct-CLI demo recording
#   img/demo-final.png    — the demo's finished config frame, as a still
#   img/wizard.gif        — vhs, interactive-wizard demo (fake-brew sandbox)
#   img/wizard-final.png  — the wizard demo's finished update frame
#
# Runs on macOS, not ubuntu: the 1.0 built-ins are all supportedOS:
# ['darwin'], so on linux the plugin registry is empty and every demo
# command fails. The wizard demo's package data comes from dev/sandbox.sh
# --fake-brew, so renders are deterministic and never touch the runner's
# real Homebrew.
#
# Rendering goes through apps/cli/dev/screenshots.sh so CI and local runs
# share the same clean-up and ffmpeg GIF compression. Also available via
# manual dispatch.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vhs:
    name: Render via vhs (help + demo + wizard)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Install vhs + JetBrains Mono font
        run: |
          brew install vhs
          brew install --cask font-jetbrains-mono

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps + build dist
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Render all visuals
        run: ./apps/cli/dev/screenshots.sh all

      - name: Upload vhs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vhs-screenshots
          path: |
            img/screenshot.png
            img/demo.gif
            img/demo-final.png
            img/wizard.gif
            img/wizard-final.png
          retention-days: 7
          if-no-files-found: error

  commit:
    name: Commit updated screenshots to main
    needs: [vhs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Download vhs artifacts
        uses: actions/download-artifact@v4
        with:
          name: vhs-screenshots
          path: img

      - name: Commit updated screenshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          file_pattern: img/screenshot.png img/demo.gif img/demo-final.png img/wizard.gif img/wizard-final.png
          commit_message: "docs(img): regenerate screenshots [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
